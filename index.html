<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Merlim - Mundo Arquiteto</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- =========================
       CONTAINER PRINCIPAL
  ========================== -->

  <div id="gameContainer">

    <!-- THREE.JS -->
    <div id="world"></div>

    <!-- OVERLAY FUTURO -->
    <div id="screenOverlay"></div>

    <!-- =========================
         JOYSTICK
    ========================== -->

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <!-- =========================
         BOTÃO PULO
    ========================== -->

    <div id="jumpButton">
      ▲
    </div>

    <!-- ÁREA DE ROTAÇÃO -->
    <div id="rotateArea"></div>

    <!-- =========================
         HUD ÍCONES
    ========================== -->

    <div id="hudIcons">

      <button
        class="hudIcon"
        id="chatIcon"
      >
        🧙‍♀️
      </button>

      <button
        class="hudIcon"
        id="dashIcon"
      >
        📊
      </button>

    </div>

    <!-- =========================
         HUD CHAT
    ========================== -->

    <div id="chatHUD">

      <div id="chatMessages"></div>

      <input
        type="text"
        id="chatInput"
        placeholder="Falar com Merlim..."
      >

    </div>

    <!-- =========================
         HUD DASHBOARD
    ========================== -->

    <div id="dashboardHUD">

      <div class="dashItem">
        Energia:
        <span id="energyValue">
          100
        </span>%
      </div>

      <div class="dashItem">
        Módulos:
        <span id="moduleCount">
          0
        </span>
      </div>

      <div class="dashItem">
        Status:
        <span id="playerStatus">
          Online
        </span>
      </div>

    </div>

  </div>

  <!-- =========================
       THREE MAIN
  ========================== -->

  <script
    type="module"
    src="main.js"
  ></script>

</body>
</html>
